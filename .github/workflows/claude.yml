name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the repository owner and collaborators can trigger Claude (public repository).
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Spec Kit task issues (label "speckit") are developed on branch dev-app-v1:
      # check it out so CLAUDE.md, the spec and the contracts are visible, and branch from it.
      # All other issues and pull requests keep the default behaviour.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ contains(github.event.issue.labels.*.name, 'speckit') && 'dev-app-v1' || '' }}

      - name: Install uv (Python toolchain for Earth Analog Finder tasks)
        if: contains(github.event.issue.labels.*.name, 'speckit')
        uses: astral-sh/setup-uv@v6

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Spec Kit task issues: new branches start from dev-app-v1 (empty = repository default)
          base_branch: ${{ contains(github.event.issue.labels.*.name, 'speckit') && 'dev-app-v1' || '' }}

          # Let Claude run the project's toolchain to meet each task's "Done" checks
          claude_args: '--allowedTools "Bash(uv:*),Bash(uvx:*),Bash(git:*),Bash(ruff:*),Bash(pytest:*),Bash(python:*)"'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

